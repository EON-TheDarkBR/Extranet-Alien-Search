<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Alien Search V2.5</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- SEARCH AREA -->
  <div class="quadrado"></div>

  <input
    class="searchbar"
    id="searchInput"
    placeholder="Search for an Alien..."
  >

  <!-- SEARCH RESULTS -->
  <div id="results"></div>


  <!-- PANELS -->
  <div id="sidePanel"></div>

  <div id="panelsContainer"></div>

  <div id="leftPanel" class="sidePanel left"></div>

  <div id="rightPanel" class="sidePanel right"></div>


  <!-- JAVASCRIPT -->

  <!-- Database -->
  <script src="js/aliens.js"></script>

  <!-- Back cards -->
  <script src="js/backcard.js"></script>

  <!-- Stat bars -->
  <script src="js/stats.js"></script>

  <!-- Side panels -->
  <script src="js/panels.js"></script>

  <!-- Search -->
  <script src="js/search.js"></script>

  <!-- Playlist -->
  <script src="js/playlist.js"></script>

  <!-- Affinity -->
  <script src="js/affinity.js"></script>

  <!-- Biological Structure -->
  <script src="js/structure.js"></script>

  <!-- Sort Results from Search.js-->
  <script src="js/sort.js"></script>

  <!-- Page initialization -->
  <script src="js/main.js"></script>

</body>

</html>
